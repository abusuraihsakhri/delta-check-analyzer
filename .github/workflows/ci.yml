name: Delta Check Analyzer CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q delta_check agents cli.py enrichment.py
      - name: Run automated tests
        run: |
          python -m pytest -q
          python -m unittest -q test_delta_check
      - name: Check installed command
        run: |
          delta-check list-analytes
          python -m delta_check list-analytes
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
