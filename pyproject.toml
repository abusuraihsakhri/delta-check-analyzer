[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-check-analyzer"
version = "3.0.0"
description = "Clinical Decision Support — Lab Result Change Detection using Reference Change Value (RCV) statistics and fixed-limit clinical thresholds"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"},
]
keywords = ["clinical", "delta-check", "rcv", "biological-variation", "lab-results", "clinical-decision-support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.23"]
test = ["pytest>=7.0"]
dev = ["fastapi>=0.111", "uvicorn>=0.23", "pytest>=7.0"]

[project.scripts]
delta-check = "cli:main"

[tool.setuptools.packages.find]
include = ["delta_check*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
